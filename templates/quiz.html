{% extends "base.html" %}

{% block title %}Quiz · QuizGen{% endblock %}

{% block content %}
<section class="card quiz-wrap">
  <div class="quiz-header">
    <div>
      <p class="eyebrow">Quiz</p>
      <h1 class="title-gap">In progress</h1>
      <p class="muted caption">Session {{ session.id }}</p>
    </div>
    <a class="btn btn-ghost" href="{{ url_for('library') }}">Library</a>
  </div>

  <p id="progress-text" class="progress-text">Loading questions…</p>
  <div class="progress-track" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>

  <h2 id="question-title" class="question-title">…</h2>
  <div id="choices" class="quiz-choices"></div>

  <div id="explanation" class="explanation hidden"></div>

  <div class="quiz-footer-actions">
    <button id="next-btn" class="btn btn-primary hidden" type="button">Next</button>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
const sessionId = "{{ session.id }}";
const baselineAttemptId = {{ baseline_attempt_id if baseline_attempt_id else "null" }};
let questions = [];
let currentIndex = 0;
let answers = {};

const progressText = document.getElementById("progress-text");
const progressFill = document.getElementById("progress-fill");
const questionTitle = document.getElementById("question-title");
const choicesWrap = document.getElementById("choices");
const explanationEl = document.getElementById("explanation");
const nextBtn = document.getElementById("next-btn");

function renderQuestion() {
  const q = questions[currentIndex];
  if (!q) return;

  progressText.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  progressFill.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
  questionTitle.textContent = `${q.order}. ${q.question}`;
  explanationEl.classList.remove("explanation--correct", "explanation--incorrect");
  explanationEl.classList.add("hidden");
  explanationEl.textContent = "";
  nextBtn.classList.add("hidden");
  choicesWrap.innerHTML = "";

  ["A", "B", "C", "D"].forEach((key) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice-btn";
    const textSpan = document.createElement("span");
    textSpan.className = "choice-btn__text";
    textSpan.textContent = `${key}. ${q.options[key]}`;
    btn.appendChild(textSpan);
    btn.onclick = () => selectAnswer(key, btn);
    choicesWrap.appendChild(btn);
  });
}

function selectAnswer(selectedKey, selectedBtn) {
  const q = questions[currentIndex];
  answers[String(q.id)] = selectedKey;

  const buttons = Array.from(choicesWrap.querySelectorAll(".choice-btn"));
  buttons.forEach((btn, idx) => {
    const key = ["A", "B", "C", "D"][idx];
    btn.disabled = true;
    if (key === q.correct_answer) {
      btn.classList.add("choice-correct");
      const badge = document.createElement("span");
      badge.className = "choice-badge choice-badge--correct";
      badge.textContent = "True";
      btn.appendChild(badge);
    }
    if (key === selectedKey && selectedKey !== q.correct_answer) {
      btn.classList.add("choice-wrong");
      const badge = document.createElement("span");
      badge.className = "choice-badge choice-badge--wrong";
      badge.textContent = "False";
      btn.appendChild(badge);
    }
  });

  explanationEl.classList.remove("explanation--correct", "explanation--incorrect");
  if (q.explanation) {
    explanationEl.textContent = q.explanation;
    explanationEl.classList.toggle("explanation--correct", selectedKey === q.correct_answer);
    explanationEl.classList.toggle("explanation--incorrect", selectedKey !== q.correct_answer);
    explanationEl.classList.remove("hidden");
  }

  nextBtn.classList.remove("hidden");
  nextBtn.textContent = currentIndex === questions.length - 1 ? "See results" : "Next";
}

nextBtn.addEventListener("click", async () => {
  if (currentIndex < questions.length - 1) {
    currentIndex += 1;
    renderQuestion();
    return;
  }

  nextBtn.disabled = true;
  nextBtn.textContent = "Calculating…";
  const res = await fetch(`/api/quiz/${sessionId}/submit`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ answers, baseline_attempt_id: baselineAttemptId })
  });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || "Failed to submit quiz.");
    nextBtn.disabled = false;
    nextBtn.textContent = "See results";
    return;
  }
  window.location.href = data.result_url;
});

async function bootstrapQuiz() {
  const res = await fetch(`/api/quiz/${sessionId}/questions`);
  const data = await res.json();
  if (!res.ok) {
    progressText.textContent = "Failed to load questions.";
    questionTitle.textContent = data.error || "An unexpected error occurred.";
    return;
  }
  questions = data.questions || [];
  if (!questions.length) {
    progressText.textContent = "No questions in this session.";
    questionTitle.textContent = "Go back to the library and generate again.";
    return;
  }
  renderQuestion();
}

bootstrapQuiz();
</script>
{% endblock %}
